<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Code 作業履歴</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Claude Code 作業履歴</div>
    <nav class="tabs" id="tabs">
      <button data-view="dashboard" class="active">ダッシュボード</button>
      <button data-view="sessions">セッション</button>
      <button data-view="tasks">タスク</button>
      <button data-view="issues">課題</button>
      <button data-view="changes">変更履歴</button>
    </nav>
    <div class="top-right">
      <input id="search" type="search" placeholder="検索(タイトル・発言・プロジェクト)">
      <span id="live" class="live off" title="リアルタイム更新の接続状態"><i></i><span>未接続</span></span>
    </div>
  </header>

  <div class="layout">
    <main id="main"></main>
    <aside id="detail" class="detail hidden"></aside>
  </div>

  <div id="tooltip" class="tooltip hidden"></div>
  <script src="/static/app.js"></script>
</body>
</html>
